org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
android.useAndroidX=true

# Firebase Data Connect runtime configuration
# Example:
# DATACONNECT_SERVICE_URL=https://us-central1-your-project.cloudfunctions.net/<connector-id>
# DATACONNECT_API_KEY=AIza...
DATACONNECT_SERVICE_URL=
DATACONNECT_API_KEY=
DATACONNECT_USE_EMULATOR=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
